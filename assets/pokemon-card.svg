<svg xmlns="http://www.w3.org/2000/svg" width="540" height="135" viewBox="0 0 540 135">
  <title>Pokémon-style card: Vitor, basic Dark type, AI/ML engineer</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sheen { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0%, 100% { transform: translateX(-340px) skewX(-18deg); } 50% { transform: translateX(340px) skewX(-18deg); } }
  </style>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241b2e"/><stop offset="0.55" stop-color="#15121c"/><stop offset="1" stop-color="#1c1410"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ff5f6d"/><stop offset="0.2" stop-color="#f0802c"/><stop offset="0.4" stop-color="#ffe66b"/>
      <stop offset="0.6" stop-color="#4ef0a8"/><stop offset="0.8" stop-color="#40bcf4"/><stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="art" cx="50%" cy="55%" r="65%"><stop offset="0" stop-color="#2d6f9a"/><stop offset="1" stop-color="#0f1722"/></radialGradient>
    <clipPath id="card"><rect x="3" y="3" width="534" height="129" rx="10"/></clipPath>
  </defs>
  <rect x="1.5" y="1.5" width="537" height="132" rx="12" fill="#e8b04a"/>
  <g clip-path="url(#card)">
    <rect width="540" height="135" fill="url(#base)"/>
    <rect width="540" height="135" fill="url(#holo)" opacity="0.16"/>
    <rect class="sheen" x="200" y="-10" width="120" height="155" fill="url(#beam)"/>
  </g>
  <rect x="12" y="12" width="112" height="111" rx="6" fill="url(#art)" stroke="#e8b04a" stroke-width="2"/>
  <image x="18" y="17" width="100" height="100" style="image-rendering:pixelated" href="data:image/png;base64,"/>
  <text class="m" x="138" y="26" font-size="11" letter-spacing="1.5" fill="#a89a82">BASIC · DARK TYPE</text>
  <text x="138" y="52" font-size="26" font-weight="800" fill="#f5e6c8">Vitor</text>
  <text x="524" y="52" font-size="16" font-weight="800" fill="#ff6b6b" text-anchor="end">HP 5</text>
  <text x="138" y="88" font-size="15" font-weight="700" fill="#f0802c">Ship It</text>
  <text x="138" y="108" font-size="12" fill="#c9bba0">ML and LLM systems in production</text>
</svg>